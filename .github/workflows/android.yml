name: Android agent build

# Uruchamia się tylko po pushu (właściciel repo) albo ręcznie.
# Celowo BEZ pull_request / pull_request_target: obce forki i PR-y nie mogą
# uruchomić budowania, dotknąć klucza podpisu ani opublikować APK.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Typh0nn/garmin-daily-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # tylko do publikacji wydania „agent-latest”
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Stały klucz podpisu z sekretu: aktualizacja APK instaluje się na poprzedniej wersji
      # bez utraty danych, a Android odrzuci „aktualizację” podpisaną innym kluczem.
      # Bez sekretu APK się buduje, ale NIE jest publikowany.
      - name: Signing key from secret
        env:
          KS: ${{ secrets.AGENT_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/agent.keystore"
            echo "AGENT_KEYSTORE=$RUNNER_TEMP/agent.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Brak sekretu AGENT_DEBUG_KEYSTORE_B64 — APK nie zostanie opublikowany."
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: agent-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Stały link do pobrania na telefonie:
      # https://github.com/Typh0nn/garmin-daily-sync/releases/download/agent-latest/agent.apk
      - name: Publish APK (release agent-latest)
        if: env.AGENT_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk agent.apk
          gh release view agent-latest >/dev/null 2>&1 || \
            gh release create agent-latest --prerelease --target "$GITHUB_SHA" \
              --title "Agent — najnowszy build" \
              --notes "Automatyczny build aplikacji Agent (Pixel). Instaluj tylko na własnym telefonie."
          gh release upload agent-latest agent.apk --clobber
          # Opis wydania jest tylko informacyjny: chwilowy błąd API nie psuje buildu.
          gh release edit agent-latest \
            --notes "Build #${{ github.run_number }} z commita ${GITHUB_SHA::7}. Instaluj tylko na własnym telefonie." \
            || echo "::warning::Nie udało się zaktualizować opisu wydania"
